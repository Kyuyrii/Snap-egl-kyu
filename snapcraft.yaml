name: egl-kyu
base: core26
adopt-info: epic-games-launcher
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
summary: Epic Games Launcher
description: |
  An unofficial Snap package for the Epic Games Launcher.
grade: stable
confinement: strict
license: Proprietary

apps:
  egl-kyu:
    command-chain: [override-xdg-paths]
    command: usr/bin/EpicGamesLauncher
    desktop: usr/share/applications/epic-games-launcher.desktop
    environment:
      HOME: $SNAP_USER_COMMON
      EGL_DISABLE_SELF_UPDATE: 1
      PROTON_USE_WOW64: "1"
    extensions: [gnome]
    plugs:
      - unity7
      - audio-playback
      - network
      - network-bind
      - network-status
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - udisks2
      - system-observe
      - hardware-observe
      - upower-observe

plugs:
  shared-memory:
    private: true

parts:
  epic-games-launcher:
    plugin: nil
    build-packages: [curl, dpkg]
    override-build: |
      set -eux
      curl -L -o "$CRAFT_PART_BUILD/epic.deb" "https://launcher-public-service-prod06.ol.epicgames.com/launcher/api/installer/download/EpicGamesLauncher-x86_64.deb"
      dpkg-deb -R "$CRAFT_PART_BUILD/epic.deb" "$CRAFT_PART_INSTALL"
      VERSION=$(awk '/^Version:/ {print $2; exit}' "$CRAFT_PART_INSTALL/DEBIAN/control")
      if [ -z "$VERSION" ]; then
        echo "ERROR: empty version from control" >&2
        exit 1
      fi
      craftctl set version="$VERSION"
      sed -i 's|Name=Epic Games Launcher|Name=Epic Games Launcher [Kyu]|' $CRAFT_PART_INSTALL/usr/share/applications/epic-games-launcher.desktop
      sed -i 's|Icon=EpicGamesLauncher|Icon=${SNAP}/usr/share/icons/hicolor/256x256@2/apps/EpicGamesLauncher.png|' $CRAFT_PART_INSTALL/usr/share/applications/epic-games-launcher.desktop
    prime:
      - usr


  dependencies:
    after: [epic-games-launcher]
    plugin: nil
    stage-packages:
      - libsdl2-2.0-0
      - libsamplerate0
      - libsdl2-classic
      - libxss1
    prime:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libSDL2*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor-0*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libsamplerate*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/sdl2-classic
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libXss.so*

  other-files:
    after: [dependencies]
    plugin: dump
    source: ./other-files/
